[package]
name = "rusty_hangulclock"
version = "0.1.0"
authors = ["Homin Lee <ff4500@gmail.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.77"

[[bin]]
name = "rusty_hangulclock"
harness = false # do not use the built in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = 3

[profile.dev]
debug = true    # Symbols are nice and they don't increase the size on Flash
opt-level = "z"

[features]
default = ["tr_to_left", "neopixel"]
ledstrip = []
neopixel = []
dotstar = []
tr_to_left = []
bl_to_top = []

experimental = ["esp-idf-svc/experimental"]

[dependencies]
log = "0.4"
# esp-idf-svc = { version = "0.52.1", features = ["critical-section", "embassy-time-driver", "embassy-sync"] }
# esp-idf-svc = { version = "0.49.1" }
esp-idf-svc = { version = "0.52.1" }
chrono = "0.4.44"
sh1106 = "0.5.0"
embedded-graphics = "0.8.2"
anyhow = "1.0.102"
embedded-svc = "0.29.0"
smart-leds = "0.4.0"
apa102-spi = "0.5.1"
embedded-hal = "1.0.0"
ws2812-spi = { version = "0.5.1", features = ["std"] }
futures = { version = "0.3.32", default-features = false, features = ["async-await", "std", "executor"] }
lazy_static = { version = "1.5.0" }
embassy-time = { version = "0.5.1", features = ["std", "generic-queue-64"] }
embedded-hal-async = "1.0.0"
rotary-encoder-hal = "0.6.0"
once_cell = "1.21.4"
rand = "0.10.0"
serde_json = "1.0.149"
urlencoding = "2.1.3"

[build-dependencies]
embuild = "0.33.1"
